  <g class="f" transform="translate(40 448)">
    <rect width="1120" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" class="h">공유 프로젝트 상태 · 계획 전에 읽고, 검증 후에 갱신</text>
    <g transform="translate(20 52)"><rect width="344" height="52" rx="8" fill="#f1f5f9"/><text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">.omb-memory/</text><text x="14" y="42" class="cb" font-size="13">팀 컨벤션과 교정 사항, Git으로 공유</text></g>
    <g transform="translate(388 52)"><rect width="344" height="52" rx="8" fill="#f1f5f9"/><text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">openwiki/</text><text x="14" y="42" class="cb" font-size="13">소스 근거가 있는 코드 지식</text></g>
    <g transform="translate(756 52)"><rect width="344" height="52" rx="8" fill="#f1f5f9"/><text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">.omb/</text><text x="14" y="42" class="cb" font-size="13">계획, todo, 인터뷰, worktree 상태</text></g>
  </g>
