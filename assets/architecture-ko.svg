<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">oh-my-braincrew 동작 방식</title>
  <desc id="d">Claude Code, Codex, omp에서 워크플로우를 호출하면 하네스의 스킬, 전문 에이전트, 필요할 때 읽는 규칙, 라이프사이클 훅이 격리된 worktree, 리뷰된 계획, 검증된 diff, PR을 만듭니다. 운영 메모리, OpenWiki, .omb 상태를 계획 전에 읽고 검증 뒤에 갱신합니다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", "Noto Sans Mono CJK KR", monospace; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; fill: #64748b; }
    .ct { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .cb { font-size: 13.5px; fill: #475569; }
    .num { font-size: 28px; font-weight: 800; }
  </style>
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>
  <text x="40" y="48" class="f h">호스트 · 같은 워크플로우를 호출</text>
  <text x="330" y="48" class="f h">하네스 · .claude/ 원본 · omb install로 설치</text>
  <text x="900" y="48" class="f h">결과물</text>

  <g class="f" filter="url(#sh)">
    <g transform="translate(40 64)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#f97316"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">Claude Code</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">/omb:goal 결제 웹훅 재시도</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">settings.json 훅 · ScheduleWakeup</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">Claude Code 세션 로그 색인</text>
    </g>
    <g transform="translate(40 188)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#22d3ee"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">Codex</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">$omb-goal 결제 웹훅 재시도</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">.agents/skills · .Codex · hooks.json</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">Codex 호스트 어댑터 규칙</text>
    </g>
    <g transform="translate(40 312)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#a78bfa"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">omp</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">/omb:goal 결제 웹훅 재시도</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">.claude 직접 읽기 · .omp/agents</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">omb-hook-bridge 확장 · 어댑터</text>
    </g>
  </g>

  <rect x="330" y="64" width="530" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <g class="f">
    <g transform="translate(350 84)"><rect width="235" height="156" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/><text x="16" y="40" class="num" fill="#047857">48</text><text x="62" y="38" class="ct">스킬</text><text x="16" y="68" class="cb">직접 호출하는 워크플로우와</text><text x="16" y="88" class="cb">필요할 때 읽는 루브릭</text><text x="16" y="114" class="m" font-size="12.5" fill="#047857">goal · plan · run · verify</text><text x="16" y="134" class="m" font-size="12.5" fill="#047857">memory · herdr · pr-watch</text></g>
    <g transform="translate(605 84)"><rect width="235" height="156" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="16" y="40" class="num" fill="#1d4ed8">37</text><text x="62" y="38" class="ct">전문 에이전트</text><text x="16" y="68" class="cb">설계 · 구현 · 검증 역할을</text><text x="16" y="88" class="cb">도메인별로 분리</text><text x="16" y="114" class="cb">API · DB · UI · AI · Infra</text><text x="16" y="134" class="cb">Security · Code · Harness</text></g>
    <g transform="translate(350 252)"><rect width="235" height="156" rx="10" fill="#fefce8" stroke="#fde68a"/><text x="16" y="40" class="num" fill="#a16207">2</text><text x="44" y="38" class="ct">상주 규칙 + 소유 문서</text><text x="16" y="68" class="cb">trigger와 운영 메모리만</text><text x="16" y="88" class="cb">항상 로드. 나머지 규칙은</text><text x="16" y="108" class="cb">INDEX.md가 경로·스킬·역할로</text><text x="16" y="128" class="cb">필요할 때만 안내합니다.</text></g>
    <g transform="translate(605 252)"><rect width="235" height="156" rx="10" fill="#fef2f2" stroke="#fecaca"/><text x="16" y="38" class="ct">라이프사이클 훅</text><text x="16" y="66" class="m" font-size="12.5" fill="#b91c1c">SessionStart</text><text x="124" y="66" class="cb" font-size="12.5">메모리 주입</text><text x="16" y="88" class="m" font-size="12.5" fill="#b91c1c">PreToolUse</text><text x="124" y="88" class="cb" font-size="12.5">위험 명령 가드</text><text x="16" y="110" class="m" font-size="12.5" fill="#b91c1c">PostToolUse</text><text x="124" y="110" class="cb" font-size="12.5">린트 · recall 집계</text><text x="16" y="132" class="m" font-size="12.5" fill="#b91c1c">Stop</text><text x="124" y="132" class="cb" font-size="12.5">Herdr 탭 정리</text></g>
  </g>

  <g class="f" filter="url(#sh)">
    <g transform="translate(900 64)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">격리된 git worktree</text><text x="16" y="48" class="cb" font-size="12.5">작업 중인 checkout은 그대로</text></g>
    <g transform="translate(900 136)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">리뷰된 계획</text><text x="16" y="48" class="cb" font-size="12.5">파일:줄 근거, P0–P3 합의 채점</text></g>
    <g transform="translate(900 208)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">검증된 diff</text><text x="16" y="48" class="cb" font-size="12.5">테스트 · 린트 · 타입 검사를 실제 실행</text></g>
    <g transform="translate(900 280)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">Pull request</text><text x="16" y="48" class="cb" font-size="12.5">자율 결정 기록 · docs(memory) 커밋</text></g>
    <g transform="translate(900 352)"><rect width="260" height="62" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/><text x="16" y="27" class="ct" font-size="15.5">/omb:pr-watch</text><text x="16" y="48" class="cb" font-size="12.5">CI 수정 · 리뷰 스레드 답변 · ready</text></g>
  </g>

