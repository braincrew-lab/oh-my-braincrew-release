  <g class="f" transform="translate(40 456)" filter="url(#sh)">
    <rect width="1120" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" class="h">공유 프로젝트 상태 · 계획 전에 읽고, 검증 뒤에 갱신</text>
    <g transform="translate(20 52)"><rect width="344" height="118" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#0f766e">.omb-memory/</text><text x="16" y="54" class="cb">팀 컨벤션 · 교정 · 함정 · 검증된 규칙</text><text x="16" y="76" class="cb">세션 시작에 4KB index만 주입</text><text x="16" y="98" class="cb">dreaming이 코드와 대조해 교정 제안</text></g>
    <g transform="translate(388 52)"><rect width="344" height="118" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#4338ca">openwiki/</text><text x="16" y="54" class="cb">소스 근거(Claim)가 붙은 코드 지식</text><text x="16" y="76" class="cb">공식 OpenWiki lifecycle로 갱신</text><text x="16" y="98" class="cb">omb context로 메모리와 함께 검색</text></g>
    <g transform="translate(756 52)"><rect width="344" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#0f172a">.omb/</text><text x="16" y="54" class="cb">계획 · todo · 인터뷰 · worktree DB</text><text x="16" y="76" class="cb">Herdr 세션 기록과 보고서</text><text x="16" y="98" class="cb">transcript index(로컬, Git 제외)</text></g>
  </g>
