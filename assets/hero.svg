<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">oh-my-braincrew</title>
  <desc id="d">A multi-agent development harness for Claude Code and Codex: interview, plan, review, run, verify, document, and open a pull request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1280" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)" opacity="0.6"/>

  <text x="80" y="138" class="f" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">oh-my-braincrew</text>
  <rect x="82" y="160" width="132" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="212" class="f" font-size="26" font-weight="500" fill="#cbd5e1">Your coding agent, organized into an engineering team.</text>
  <text x="80" y="250" class="f" font-size="19" fill="#94a3b8">Specialist agents plan, review, build, and verify. Nothing ships until the checks pass.</text>

  <g class="m" font-size="15">
    <rect x="80" y="290" width="166" height="34" rx="17" fill="#132a24" stroke="#065f46"/>
    <text x="163" y="312" text-anchor="middle" fill="#6ee7b7">59 agents</text>
    <rect x="258" y="290" width="166" height="34" rx="17" fill="#132a24" stroke="#065f46"/>
    <text x="341" y="312" text-anchor="middle" fill="#6ee7b7">77 skills</text>
    <rect x="436" y="290" width="166" height="34" rx="17" fill="#132a24" stroke="#065f46"/>
    <text x="519" y="312" text-anchor="middle" fill="#6ee7b7">135 rules</text>
    <rect x="614" y="290" width="236" height="34" rx="17" fill="#13213a" stroke="#1e40af"/>
    <text x="732" y="312" text-anchor="middle" fill="#93c5fd">Claude Code + Codex</text>
  </g>

  <!-- terminal card -->
  <g transform="translate(900 70)">
    <rect width="320" height="264" rx="12" fill="#0a0f1a" stroke="#24324f"/>
    <circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="38" cy="20" r="5" fill="#fbbf24"/><circle cx="56" cy="20" r="5" fill="#34d399"/>
    <g class="m" font-size="13">
      <text x="18" y="58" fill="#64748b">&gt;</text>
      <text x="32" y="58" fill="#e2e8f0">/omb:goal add retry logic</text>
      <text x="32" y="76" fill="#e2e8f0">to the payment webhook</text>
      <text x="18" y="108" fill="#34d399">✓</text><text x="36" y="108" fill="#94a3b8">interview</text>
      <text x="18" y="130" fill="#34d399">✓</text><text x="36" y="130" fill="#94a3b8">plan → plan-review</text>
      <text x="18" y="152" fill="#34d399">✓</text><text x="36" y="152" fill="#94a3b8">run (TDD)</text>
      <text x="18" y="174" fill="#34d399">✓</text><text x="36" y="174" fill="#94a3b8">verify: pytest · ruff · tsc</text>
      <text x="18" y="196" fill="#34d399">✓</text><text x="36" y="196" fill="#94a3b8">doc</text>
      <text x="18" y="228" fill="#60a5fa">→</text><text x="36" y="228" fill="#e2e8f0">pull request opened</text>
    </g>
  </g>
</svg>
