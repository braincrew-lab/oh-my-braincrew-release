<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">oh-my-braincrew</title>
  <desc id="d">A multi-agent development harness for Claude Code, Codex, and omp. It turns a one-line goal into a reviewable PR through interview, planning, review, TDD implementation, verification, docs, and a memory retro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1a"/><stop offset="0.55" stop-color="#0d1730"/><stop offset="1" stop-color="#14183a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.18" r="0.5"><stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.45"><stop offset="0" stop-color="#10b981" stop-opacity="0.22"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1b2645" stroke-width="1"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", "Noto Sans Mono CJK KR", monospace; }
  </style>
  <rect width="1280" height="460" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="460" rx="18" fill="url(#glow1)"/>
  <rect width="1280" height="460" rx="18" fill="url(#glow2)"/>

  <g class="f">
    <text x="72" y="92" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc">AI ENGINEERING HARNESS</text>
    <text x="70" y="160" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="-1.8">oh-my-braincrew</text>
    <rect x="73" y="180" width="168" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="236" font-size="29" font-weight="700" fill="#e2e8f0">Coding agents as an engineering team</text>
    <text x="72" y="274" font-size="29" font-weight="700" fill="#e2e8f0">that remembers and verifies</text>
    <text x="72" y="314" font-size="17" fill="#94a3b8">One-line goal → interview · plan · review · TDD · verify · docs · memory retro → reviewable PR</text>
  </g>

  <g class="f" transform="translate(72 344)">
    <rect width="150" height="38" rx="19" fill="#0f1b33" stroke="#334155"/>
    <circle cx="22" cy="19" r="6" fill="#f97316"/>
    <text x="36" y="25" font-size="16" font-weight="600" fill="#f1f5f9">Claude Code</text>
    <g transform="translate(162 0)">
      <rect width="104" height="38" rx="19" fill="#0f1b33" stroke="#334155"/>
      <circle cx="22" cy="19" r="6" fill="#22d3ee"/>
      <text x="36" y="25" font-size="16" font-weight="600" fill="#f1f5f9">Codex</text>
    </g>
    <g transform="translate(278 0)">
      <rect width="92" height="38" rx="19" fill="#0f1b33" stroke="#334155"/>
      <circle cx="22" cy="19" r="6" fill="#a78bfa"/>
      <text x="36" y="25" font-size="16" font-weight="600" fill="#f1f5f9">omp</text>
    </g>
  </g>
  <g class="f" transform="translate(72 412)" font-size="15" fill="#94a3b8">
    <text x="0" y="0"><tspan fill="#f8fafc" font-weight="800">48</tspan> skills   ·   <tspan fill="#f8fafc" font-weight="800">37</tspan> specialist agents   ·   <tspan fill="#f8fafc" font-weight="800">2</tspan> always-on rules   ·   memory shared via Git</text>
  </g>

