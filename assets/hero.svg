      <text x="40" y="74" fill="#f1f5f9">/omb:goal retry failed payment webhooks</text>
      <text x="22" y="108" fill="#34d399">✓</text><text x="44" y="108" fill="#cbd5e1">interview</text><text x="190" y="108" fill="#64748b">scope &amp; acceptance criteria</text>
      <text x="22" y="134" fill="#34d399">✓</text><text x="44" y="134" fill="#cbd5e1">plan</text><text x="190" y="134" fill="#64748b">file:line evidence</text>
      <text x="22" y="160" fill="#34d399">✓</text><text x="44" y="160" fill="#cbd5e1">plan-review</text><text x="190" y="160" fill="#64748b">P0 0 · P1 0 · 86%</text>
      <text x="22" y="186" fill="#34d399">✓</text><text x="44" y="186" fill="#cbd5e1">run</text><text x="190" y="186" fill="#64748b">RED → GREEN → IMPROVE</text>
      <text x="22" y="212" fill="#34d399">✓</text><text x="44" y="212" fill="#cbd5e1">verify</text><text x="190" y="212" fill="#64748b">pytest · ruff · tsc</text>
      <text x="22" y="238" fill="#34d399">✓</text><text x="44" y="238" fill="#cbd5e1">doc</text><text x="190" y="238" fill="#64748b">docs/ + openwiki/</text>
      <text x="22" y="264" fill="#34d399">✓</text><text x="44" y="264" fill="#cbd5e1">retro</text><text x="190" y="264" fill="#64748b">memory saved · dreaming</text>
      <text x="22" y="290" fill="#34d399">✓</text><text x="44" y="290" fill="#cbd5e1">pr</text><text x="190" y="290" fill="#64748b">PR opened · ultra-review</text>
      <text x="22" y="316" fill="#60a5fa">◐</text><text x="44" y="316" fill="#f1f5f9">pr-watch</text><text x="190" y="316" fill="#60a5fa">CI passed · answering reviews</text>
