<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">How oh-my-braincrew works</title>
  <desc id="d">When Claude Code, Codex, or omp invokes a workflow, the harness skills, specialist agents, on-demand rules, and lifecycle hooks produce an isolated worktree, a reviewed plan, a verified diff, and a PR. Operating memory, OpenWiki, and .omb state are read before planning and updated after verification.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", "Noto Sans Mono CJK KR", monospace; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; fill: #64748b; }
    .ct { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .cb { font-size: 13.5px; fill: #475569; }
    .num { font-size: 28px; font-weight: 800; }
  </style>
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>
  <text x="40" y="48" class="f h">Hosts · invoke the same workflow</text>
  <text x="330" y="48" class="f h">Harness · .claude/ source · installed by omb install</text>
  <text x="900" y="48" class="f h">Outputs</text>

  <g class="f" filter="url(#sh)">
    <g transform="translate(40 64)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#f97316"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">Claude Code</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">/omb:goal webhook retry</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">settings.json hooks · ScheduleWakeup</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">Claude Code session log index</text>
    </g>
    <g transform="translate(40 188)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#22d3ee"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">Codex</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">$omb-goal webhook retry</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">.agents/skills · .Codex · hooks.json</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">Codex host adapter rules</text>
    </g>
    <g transform="translate(40 312)">
      <rect width="250" height="112" rx="12" fill="#0f172a"/>
      <circle cx="20" cy="24" r="6" fill="#a78bfa"/><text x="34" y="29" font-size="15" font-weight="700" fill="#f8fafc">omp</text>
      <text x="18" y="58" class="m" font-size="13.5" fill="#e2e8f0">/omb:goal webhook retry</text>
      <text x="18" y="84" font-size="12.5" fill="#94a3b8">reads .claude directly · .omp/agents</text>
      <text x="18" y="102" font-size="12.5" fill="#94a3b8">omb-hook-bridge extension · adapters</text>
    </g>
  </g>

  <rect x="330" y="64" width="530" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <g class="f">
    <g transform="translate(350 84)"><rect width="235" height="156" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/><text x="16" y="40" class="num" fill="#047857">48</text><text x="62" y="38" class="ct">skills</text><text x="16" y="68" class="cb">Workflows you invoke directly</text><text x="16" y="88" class="cb">plus rubrics read on demand</text><text x="16" y="114" class="m" font-size="12.5" fill="#047857">goal · plan · run · verify</text><text x="16" y="134" class="m" font-size="12.5" fill="#047857">memory · herdr · pr-watch</text></g>
    <g transform="translate(605 84)"><rect width="235" height="156" rx="10" fill="#eff6ff" stroke="#bfdbfe"/><text x="16" y="40" class="num" fill="#1d4ed8">37</text><text x="62" y="38" class="ct">specialist agents</text><text x="16" y="68" class="cb">Design · build · verify roles</text><text x="16" y="88" class="cb">split by domain</text><text x="16" y="114" class="cb">API · DB · UI · AI · Infra</text><text x="16" y="134" class="cb">Security · Code · Harness</text></g>
    <g transform="translate(350 252)"><rect width="235" height="156" rx="10" fill="#fefce8" stroke="#fde68a"/><text x="16" y="40" class="num" fill="#a16207">2</text><text x="44" y="38" class="ct">always-on rules + docs</text><text x="16" y="68" class="cb">Only trigger and operating memory</text><text x="16" y="88" class="cb">always load. INDEX.md points to</text><text x="16" y="108" class="cb">other rules by path, skill, or role</text><text x="16" y="128" class="cb">only when needed.</text></g>
    <g transform="translate(605 252)"><rect width="235" height="156" rx="10" fill="#fef2f2" stroke="#fecaca"/><text x="16" y="38" class="ct">Lifecycle hooks</text><text x="16" y="66" class="m" font-size="12.5" fill="#b91c1c">SessionStart</text><text x="124" y="66" class="cb" font-size="12.5">inject memory</text><text x="16" y="88" class="m" font-size="12.5" fill="#b91c1c">PreToolUse</text><text x="124" y="88" class="cb" font-size="12.5">guard risky cmds</text><text x="16" y="110" class="m" font-size="12.5" fill="#b91c1c">PostToolUse</text><text x="124" y="110" class="cb" font-size="12.5">lint · recall stats</text><text x="16" y="132" class="m" font-size="12.5" fill="#b91c1c">Stop</text><text x="124" y="132" class="cb" font-size="12.5">clean Herdr tabs</text></g>
  </g>

  <g class="f" filter="url(#sh)">
    <g transform="translate(900 64)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">Isolated git worktree</text><text x="16" y="48" class="cb" font-size="12.5">Your working checkout stays as is</text></g>
    <g transform="translate(900 136)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">Reviewed plan</text><text x="16" y="48" class="cb" font-size="12.5">file:line evidence · P0–P3 consensus</text></g>
    <g transform="translate(900 208)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">Verified diff</text><text x="16" y="48" class="cb" font-size="12.5">Really runs tests · lint · type checks</text></g>
    <g transform="translate(900 280)"><rect width="260" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="16" y="27" class="ct" font-size="15.5">Pull request</text><text x="16" y="48" class="cb" font-size="12.5">Decision log · docs(memory) commit</text></g>
    <g transform="translate(900 352)"><rect width="260" height="62" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/><text x="16" y="27" class="ct" font-size="15.5">/omb:pr-watch</text><text x="16" y="48" class="cb" font-size="12.5">Fix CI · answer review threads · ready</text></g>
  </g>

  <path d="M290 120 H312 V244 H326" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M290 244 H326" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M290 368 H312 V244" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M860 244 H880 V95 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 167 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 239 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 311 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 239 V383 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <g class="f" transform="translate(40 456)" filter="url(#sh)">
    <rect width="1120" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" class="h">Shared project state · read before planning, updated after verification</text>
    <g transform="translate(20 52)"><rect width="344" height="118" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#0f766e">.omb-memory/</text><text x="16" y="54" class="cb">Conventions · corrections · pitfalls · verified rules</text><text x="16" y="76" class="cb">Only a 4KB index injected at session start</text><text x="16" y="98" class="cb">dreaming checks against code, proposes fixes</text></g>
    <g transform="translate(388 52)"><rect width="344" height="118" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#4338ca">openwiki/</text><text x="16" y="54" class="cb">Code knowledge with source evidence (Claims)</text><text x="16" y="76" class="cb">Updated via the official OpenWiki lifecycle</text><text x="16" y="98" class="cb">Searched with memory via omb context</text></g>
    <g transform="translate(756 52)"><rect width="344" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/><text x="16" y="28" class="m" font-size="15" font-weight="700" fill="#0f172a">.omb/</text><text x="16" y="54" class="cb">Plans · todos · interviews · worktree DB</text><text x="16" y="76" class="cb">Herdr session records and reports</text><text x="16" y="98" class="cb">transcript index (local, not in Git)</text></g>
  </g>
  <path d="M595 452 V428" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
