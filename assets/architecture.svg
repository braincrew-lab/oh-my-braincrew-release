<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">How oh-my-braincrew works</title>
  <desc id="d">You call a workflow from Claude Code or Codex. The harness installed by omb install routes it through skills, specialist agents, path-scoped rules and lifecycle hooks, and produces an isolated worktree, a reviewed plan, a verified diff and a pull request.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
    .ct { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .cb { font-size: 14px; fill: #475569; }
    .num { font-size: 26px; font-weight: 800; }
  </style>

  <rect width="1200" height="600" rx="16" fill="#f8fafc"/>

  <!-- column headers -->
  <text x="40" y="52" class="f h">YOU</text>
  <text x="330" y="52" class="f h">THE HARNESS  ·  .claude/  ·  installed by omb install</text>
  <text x="900" y="52" class="f h">WHAT YOU GET</text>

  <!-- YOU -->
  <g transform="translate(40 72)">
    <rect width="250" height="200" rx="12" fill="#0f172a"/>
    <g class="m" font-size="13">
      <text x="16" y="34" fill="#94a3b8">Claude Code</text>
      <text x="16" y="58" fill="#e2e8f0">/omb:goal add retry</text>
      <text x="16" y="76" fill="#e2e8f0">logic to the webhook</text>
      <line x1="16" y1="100" x2="234" y2="100" stroke="#1e293b"/>
      <text x="16" y="128" fill="#94a3b8">Codex</text>
      <text x="16" y="152" fill="#e2e8f0">$omb-goal add retry</text>
      <text x="16" y="170" fill="#e2e8f0">logic to the webhook</text>
    </g>
  </g>
  <g transform="translate(40 296)" class="f">
    <rect width="250" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="16" y="32" class="ct">One gate, then hands-off</text>
    <text x="16" y="58" class="cb">Answer the interview and</text>
    <text x="16" y="78" class="cb">approve once. The pipeline</text>
    <text x="16" y="98" class="cb">runs until a PR is open.</text>
    <text x="16" y="118" class="cb">It never merges for you.</text>
  </g>

  <!-- HARNESS container -->
  <rect x="330" y="72" width="520" height="352" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 5"/>

  <g class="f">
    <g transform="translate(350 92)">
      <rect width="230" height="150" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="16" y="38" class="num" fill="#047857">77</text>
      <text x="62" y="36" class="ct">skills</text>
      <text x="16" y="66" class="cb">The workflows you call:</text>
      <text x="16" y="88" class="cb m" font-size="13">goal · plan · run</text>
      <text x="16" y="108" class="cb m" font-size="13">verify · fix · pr</text>
      <text x="16" y="128" class="cb m" font-size="13">refactoring · pr-watch</text>
    </g>
    <g transform="translate(600 92)">
      <rect width="230" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="16" y="38" class="num" fill="#1d4ed8">59</text>
      <text x="62" y="36" class="ct">agents</text>
      <text x="16" y="66" class="cb">design · implement · verify</text>
      <text x="16" y="86" class="cb">specialists per domain:</text>
      <text x="16" y="108" class="cb">API · DB · UI · AI · Electron</text>
      <text x="16" y="128" class="cb">Infra · Security · Harness</text>
    </g>
    <g transform="translate(350 256)">
      <rect width="230" height="150" rx="10" fill="#fefce8" stroke="#fde68a"/>
      <text x="16" y="38" class="num" fill="#a16207">135</text>
      <text x="76" y="36" class="ct">rules</text>
      <text x="16" y="66" class="cb">Loaded by file path, so a</text>
      <text x="16" y="86" class="cb">FastAPI edit gets FastAPI</text>
      <text x="16" y="106" class="cb">rules and nothing else.</text>
      <text x="16" y="128" class="cb">React · LangGraph · Postgres…</text>
    </g>
    <g transform="translate(600 256)">
      <rect width="230" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
      <text x="16" y="36" class="ct">Lifecycle hooks</text>
      <text x="16" y="66" class="cb">Guard sessions and tool calls:</text>
      <text x="16" y="88" class="cb">· out-of-scope writes</text>
      <text x="16" y="108" class="cb">· raw SQL, untimed pytest runs</text>
      <text x="16" y="128" class="cb">· sub-agent output contract</text>
    </g>
  </g>

  <!-- OUTPUT -->
  <g class="f">
    <g transform="translate(900 72)">
      <rect width="260" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" class="ct" font-size="16">Isolated git worktree</text>
      <text x="16" y="50" class="cb" font-size="13">your main checkout stays clean</text>
    </g>
    <g transform="translate(900 144)">
      <rect width="260" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" class="ct" font-size="16">Reviewed plan</text>
      <text x="16" y="50" class="cb" font-size="13">anchored to real files, P0–P3 scored</text>
    </g>
    <g transform="translate(900 216)">
      <rect width="260" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" class="ct" font-size="16">Verified diff</text>
      <text x="16" y="50" class="cb" font-size="13">tests, lint and types actually run</text>
    </g>
    <g transform="translate(900 288)">
      <rect width="260" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="28" class="ct" font-size="16">Pull request</text>
      <text x="16" y="50" class="cb" font-size="13">with an autonomous-decision log</text>
    </g>
    <g transform="translate(900 360)">
      <rect width="260" height="64" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="16" y="28" class="ct" font-size="16">/omb:pr-watch</text>
      <text x="16" y="50" class="cb" font-size="13">fixes CI, answers review threads</text>
    </g>
  </g>

  <!-- arrows -->
  <path d="M290 172 H326" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M850 248 H880 V104 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 176 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 248 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 320 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M880 248 V392 H896" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- shared state strip -->
  <g class="f" transform="translate(40 448)">
    <rect width="1120" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" class="h" font-size="13">SHARED PROJECT STATE  ·  read before planning, updated after verifying</text>
    <g transform="translate(20 52)">
      <rect width="344" height="52" rx="8" fill="#f1f5f9"/>
      <text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">.omb-memory/</text>
      <text x="14" y="42" class="cb" font-size="13">team conventions and corrections, in Git</text>
    </g>
    <g transform="translate(388 52)">
      <rect width="344" height="52" rx="8" fill="#f1f5f9"/>
      <text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">openwiki/</text>
      <text x="14" y="42" class="cb" font-size="13">source-backed facts about your code</text>
    </g>
    <g transform="translate(756 52)">
      <rect width="344" height="52" rx="8" fill="#f1f5f9"/>
      <text x="14" y="22" class="m" font-size="14" font-weight="700" fill="#0f172a">.omb/</text>
      <text x="14" y="42" class="cb" font-size="13">plans, todo, interviews, worktree state</text>
    </g>
  </g>
  <path d="M590 424 V444" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M590 444 V428" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
</svg>
